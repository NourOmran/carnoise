[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "carnoise"
version = "2.0.0"
description = "Removes a recording car's own noise (engine, road, wind, fans) from street audio recorded with mics on the car"
readme = "README.md"
authors = [{ name = "Nour Omran" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "soundfile>=0.12",
    "pandas>=1.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
carnoise = "carnoise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
