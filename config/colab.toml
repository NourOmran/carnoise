# Run on Google Colab (with Drive mounted at /content/drive).
# Run:  carnoise batch -c config/colab.toml
# GPS speed is read from <data_root>/gps/<unit>_gps.csv.
#
# Once an output folder has results in it, leave [selection], [dsp], [chunking] and output.subtype
# alone: they get locked in <out_root>/run_config.json. To try different settings, use a new
# out_root and a new profile.

[paths]
data_root = "/content/drive/MyDrive/ensense"                     # contains files.csv and gps/
out_root  = "/content/drive/MyDrive/ensense_denoise_carnoise_v3" # results + logs
tmp_root  = "/content/ensense_work"                              # local scratch, cleaned per file

[selection]
include_driving = true
include_office  = true
max_files       = 0          # 0 = all; a small number for a smoke test

[dsp]
profile            = "carnoise_v3"
engine_notch       = false   # true = also notch the engine's harmonics (more drone removed, a bit less clean)
high_pass_hz       = "auto"  # "auto" (70-200 Hz per file) or Hz
low_pass_hz        = "auto"  # "auto", Hz, or "none"
remove_tonal_lines = true    # fans / alternator / electronics whine
floor_shift_db     = 0.0     # negative = stronger removal, positive = more natural

[chunking]
block_seconds   = 45.0       # ~44.4 s after rounding to the DSP grid
context_seconds = 6.0        # ~6.8 s; noise tracking needs >= 5 s

[output]
subtype            = "PCM_24"     # 24-bit lossless FLAC
other_sample_rates = "resample"   # "resample" (to 48 kHz) or "error"

[run]
resume           = true      # skip outputs that already exist
checkpoint_every = 5         # write the CSV logs every N files
